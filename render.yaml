services:
  - type: web
    name: vpo-studio-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: TEST_MODE
        value: "false"
      - key: PUBLISH_MODE
        value: live
      - key: AUTH_MODE
        value: supabase
      - key: STORAGE_MODE
        value: supabase
      - key: PUBLIC_OAUTH_CALLBACK_BASE_URL
        value: https://vpo-studio-backend.onrender.com
      - key: FRONTEND_ORIGINS
        value: https://vpo-studio.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: PLATFORM_TOKEN_KEYS_JSON
        sync: false
      - key: PLATFORM_TOKEN_ACTIVE_KEY_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: META_CLIENT_ID
        sync: false
      - key: META_CLIENT_SECRET
        sync: false
      - key: META_GRAPH_API_VERSION
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_API_VERSION
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

  - type: web
    name: vpo-studio
    runtime: docker
    plan: free
    region: singapore
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://vpo-studio-backend.onrender.com
      - key: NEXT_PUBLIC_AUTH_MODE
        value: supabase
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
