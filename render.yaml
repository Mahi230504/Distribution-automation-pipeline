services:
  - type: web
    name: vpo-studio-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    numInstances: 1
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: TEST_MODE
        value: "true"
      - key: PUBLISH_MODE
        value: test
      - key: AUTH_MODE
        value: supabase
      - key: STORAGE_MODE
        value: supabase
      - key: PUBLIC_OAUTH_CALLBACK_BASE_URL
        value: https://vpo-studio-backend.onrender.com
      - key: PUBLIC_FRONTEND_BASE_URL
        value: https://vpo-studio.onrender.com
      - key: FRONTEND_ORIGINS
        value: https://vpo-studio.onrender.com,http://localhost:3000,http://127.0.0.1:3000
      - key: GEMINI_MODEL_MAIN
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_SCORING
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_IMAGE
        value: gemini-3.1-flash-image
      - key: MEDIA_UPLOAD_MAX_BYTES
        value: "52428800"
      - key: GEMINI_API_KEY
        sync: false
      - key: PLATFORM_TOKEN_KEYS_JSON
        sync: false
      - key: PLATFORM_TOKEN_ACTIVE_KEY_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: META_CLIENT_ID
        sync: false
      - key: META_CLIENT_SECRET
        sync: false
      - key: META_GRAPH_API_VERSION
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_API_VERSION
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

  - type: web
    name: vpo-studio
    runtime: docker
    plan: free
    region: singapore
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    numInstances: 1
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://vpo-studio-backend.onrender.com
      - key: NEXT_PUBLIC_AUTH_MODE
        value: supabase
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
